function escapeQuote(text) {
  return String(text).replaceAll("'", "\\'");

  Object.entries(profile.jobs).forEach(([name, level]) => {
    html += `

        <button class="del" onclick="removeJob('${escapeQuote(name)}')">削除</button>
      </div>
    `;
  });

  $("jobList").innerHTML = html;

  const missingJobs = standardJobs.filter(job => profile.jobs[job] === undefined).slice(0, 12);

  $("quickJobs").innerHTML = missingJobs

}

function marketSorted() {
  return items.map(item => {
    const doable = canDo(item);

    const profit =
      item.type === "craft" && item.materialCost
        ? item.worldPrice - item.materialCost
        : item.worldPrice;

    let priority = 0;
    if (doable) priority += 50;
    if (item.velocity === "高") priority += 20;
    if (profit > 0) priority += Math.min(30, profit / 20);
    if (item.item === "銀鉱") priority += 15;
    if (item.api?.saleVelocity) priority += Math.min(20, item.api.saleVelocity * 3);

    return {
      ...item,
      doable,
      profit,
      priority
    };
  }).sort((a, b) => b.priority - a.priority);
}

  $("suggestedItems").innerHTML =
    marketSorted()
      .filter(item => item.doable)
      .slice(0, 4)
      .map(marketCard)
      .join("") || '<p class="small">今できる監視候補がありません</p>';

  $("marketList").innerHTML = marketSorted().map(marketCard).join("");

  if (!$("marketStatus").textContent) {
    $("marketStatus").textContent = marketFresh
      ? "Universalis相場取得済み"
      : "未取得。ボタンで実相場を取得できます。";
  }
}

function marketCard(item) {
  const api = item.api
    ? `
      <div class="small">
        API: 最安 ${item.api.minPrice?.toLocaleString() || "-"} /
        在庫 ${item.api.totalQty || 0} /
        直近販売 ${item.api.saleVelocity?.toFixed(1) || 0}/日
      </div>
    `
    : "";

  return `
    <div class="item ${item.doable ? "ok" : "lock"}">
      <b>${item.doable ? "🔓" : "🔒"} ${item.item}</b>
      <div class="small">${item.job} Lv${item.requiredLevel}〜 / 回転:${item.velocity}</div>
      <div>${item.worldPrice ? item.worldPrice.toLocaleString() + " gil" : "日課"}</div>
      ${api}
      <p>${item.memo}</p>
      <span class="badge">${item.doable ? item.advice : "今は不可"}</span>
    </div>
  `;
}

function analyzeMarket() {
  const rows = $("marketText").value
    .split(/\n|,/)
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      const match = line.match(/^(.+?)\s*(\d{2,})/);
      const name = match ? match[1].trim() : line;
      const price = match ? Number(match[2]) : 0;
      const known = items.find(item => name.includes(item.item) || item.item.includes(name));

      return marketCard({
        ...known,
        item: name,
        worldPrice: price || known?.worldPrice || 0,
        doable: known ? canDo(known) : true,
        job: known?.job || "未設定",
        requiredLevel: known?.requiredLevel || 0,
        velocity: known?.velocity || "要確認",
        advice: known?.advice || "相場確認",
        memo: known?.memo || "出品数と履歴を見て判断"
      });
    })
    .join("");

  $("marketList").innerHTML = rows;
}

async function fetchMarket() {
  const ids = items
    .filter(item => item.itemId)
    .map(item => item.itemId)
    .join(",");

  if (!ids) return;

  const world = encodeURIComponent(profile.world || "Shinryu");

  $("marketStatus").textContent = "Universalisから取得中...";

  try {
    const url = `https://universalis.app/api/v2/${world}/${ids}?listings=10&entries=20`;
    const response = await fetch(url);

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();

    applyMarketData(data);

    localStorage.setItem("ep_market_cache", JSON.stringify({
      t: Date.now(),
      world: profile.world,
      data
    }));

    marketFresh = true;
    $("marketStatus").textContent = "取得成功: " + new Date().toLocaleString();

    renderMarket();
  } catch (error) {
    $("marketStatus").innerHTML = `
      <span class="warn">
        取得失敗: ${error.message}。GitHub Pages上/HTTPSで再試行、または手入力を使ってください。
      </span>
    `;
  }
}

function applyMarketData(data) {
  const map = data.items || {};

  items = items.map(item => {
    if (!item.itemId) return item;

    const marketData =
      map[item.itemId] ||
      map[String(item.itemId)] ||
      (data.itemID === item.itemId ? data : null);

    if (!marketData) return item;

    const listings = marketData.listings || [];
    const history = marketData.recentHistory || marketData.sales || [];

    const minPrice = listings.length
      ? Math.min(...listings.map(listing => listing.pricePerUnit || listing.price || 999999999))
      : item.worldPrice;

    const totalQty = listings.reduce((sum, listing) => sum + (listing.quantity || 0), 0);

    const saleVelocity =
      marketData.regularSaleVelocity ||
      marketData.nqSaleVelocity ||
      marketData.hqSaleVelocity ||
      0;

    item.worldPrice = minPrice || item.worldPrice;

    item.api = {
      minPrice,
      totalQty,
      saleVelocity,
      historyCount: history.length
    };

    return item;
  });
}

function loadCachedMarket() {
  try {
    const cache = JSON.parse(localStorage.getItem("ep_market_cache") || "null");

    if (cache && cache.data && Date.now() - cache.t < 21600000) {
      applyMarketData(cache.data);
      marketFresh = true;
      $("marketStatus").textContent = "キャッシュ相場を使用: " + new Date(cache.t).toLocaleString();
    }
  } catch (error) {
    console.warn(error);
  }
}

function renderDaily() {

    { id: "market", text: "マケボ出品価格を見直す", group: "金策", minutes: 5 },
    { id: "ore", text: "銀鉱 or シャードを補充", group: "金策", minutes: 15 },

  ];

  if ((profile.jobs["採掘師"] || 0) >= 25) {
    tasks.splice(2, 0, {
      id: "silverOre",

    });
  }

  if ((profile.jobs["彫金師"] || 0) < 23) {
    tasks.push({
      id: "gsm23",

      group: "育成",
      minutes: 20
    });
  }

  if ((profile.jobs["占星術師"] || 0) < 50) {

  const remainingTasks = tasks.filter(task => !localStorage.getItem("done_" + task.id));

  $("taskSummary").textContent = `${remainingTasks.length}件 / 約${leftMinutes}分`;

  $("tasks").innerHTML = tasks.map(task => `

    "普通 30分|今日のおすすめ品を採取/製作|占星ルレ1回|蒼天までの行けるスポットでSS1枚",

  ].map(plan => {

window.toggleTask = id => {
  if (localStorage.getItem("done_" + id)) {
    localStorage.removeItem("done_" + id);
  } else {
    localStorage.setItem("done_" + id, "1");
  }

  renderDaily();
};

function qrBits(text) {
  let seed = 0;

  for (const char of text) {
    seed = (seed * 31 + char.charCodeAt(0)) >>> 0;
  }

  let html = "";

  for (let index = 0; index < 441; index++) {
    seed = (seed * 1664525 + 1013904223) >>> 0;

    html += `
      <div class="${(seed % 7 < 3 || (index < 147 && index % 21 < 7)) ? "black" : "white"}"></div>
    `;
  }

  return html;
}

function renderQr() {
  $("qrValue").value = $("qrValue").value || "eorzea-pocket://spot/" + selected.id;
  $("qrBox").innerHTML = qrBits($("qrValue").value);
}

function readQr() {
  const id = $("qrValue").value.split("/").pop();
  const spot = spots.find(item => item.id === id);

  if (spot) {
    selected = spot;
    document.querySelector('[data-tab="spot"]').click();
  }

  $("scanLog").textContent = spot
    ? "スポットを読み込みました：" + spot.title
    : "QR文字列を受け取りました";
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    $("video").srcObject = stream;
    $("scanLog").textContent = "カメラ起動OK。実装ではBarcodeDetectorでQR解析予定。";
  } catch (error) {
    $("scanLog").textContent = "カメラ起動に失敗。HTTPS/権限を確認。";
  }
}

function renderAll() {
  renderSpots();
  renderMarket();
  renderDaily();
  renderQr();
}

bind();
init();
