<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eorzea Pocket</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Eorzea Pocket</h1>
      <p>FF14プレイヤー向けスマホ便利ツール</p>
    </div>
    <div id="worldBadge" class="world-badge">Meteor / Shinryu</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="self">自分</button>
    <button class="tab-btn" data-tab="walk">散歩</button>
    <button class="tab-btn" data-tab="market">金策</button>
    <button class="tab-btn" data-tab="today">今日</button>
  </nav>

  <main>
    <section id="tab-self" class="panel active">
      <div class="grid two-col">
        <article class="card">
          <h2>自分情報</h2>

          <div class="form-grid two-col">
            <label><span>キャラ名</span><input id="profileCharacter"></label>
            <label><span>ワールド</span><input id="profileWorld"></label>
            <label><span>DC</span><input id="profileDc"></label>
            <label><span>メイン進行度</span><select id="profileProgress"></select></label>
            <label><span>所持ギル</span><input id="profileGil" type="number" min="0"></label>
            <label><span>軍票</span><input id="profileSeals" type="number" min="0"></label>
            <label><span>ベンチャー</span><input id="profileVentures" type="number" min="0"></label>
          </div>

          <label class="switch">
            <input id="hideLockedSpots" type="checkbox">
            <span>行けない散歩スポットを隠す</span>
          </label>

          <h3>PC / スマホ同期</h3>
          <p class="muted">SupabaseのURLとanon keyを設定すると、同じ同期キーで端末間同期できます。</p>

          <label><span>同期キー</span><input id="syncKey" placeholder="例：yuzu-eorzea-pocket"></label>

          <div class="row">
            <button id="saveProfileBtn" class="btn primary">この端末に保存</button>
            <button id="cloudSaveBtn" class="btn primary">クラウドへ保存</button>
            <button id="cloudLoadBtn" class="btn">クラウドから読み込み</button>
          </div>

          <div id="syncStatus" class="status">未同期</div>
        </article>

        <article class="card">
          <h2>ジョブ / クラスLv</h2>

          <div class="form-grid two-col">
            <label><span>ジョブ名</span><input id="jobNameInput" placeholder="例：ピクトマンサー"></label>
            <label><span>Lv</span><input id="jobLevelInput" type="number" min="0" max="100" value="1"></label>
          </div>

          <button id="addJobBtn" class="btn primary">ジョブ追加</button>

          <h3>クイック追加</h3>
          <div id="quickJobs" class="chips"></div>

          <h3>登録済み</h3>
          <div id="jobList"></div>
        </article>
      </div>
    </section>

    <section id="tab-walk" class="panel">
      <div class="grid two-col">
        <article class="card">
          <h2>散歩スポット</h2>
          <div class="search-row">
            <input id="spotSearchInput" placeholder="夜景、雪、クガネ、花畑、海…">
          </div>

          <div class="row">
            <button id="gachaSpotBtn" class="btn primary">散歩ガチャ</button>
            <button id="clearSpotSearchBtn" class="btn">検索クリア</button>
          </div>

          <div id="spotList"></div>
        </article>

        <article class="card">
          <h2>選択中スポット</h2>
          <div id="spotDetail"></div>

          <h3>スポット追加</h3>
          <div class="form-grid two-col">
            <input id="newSpotName" placeholder="スポット名">
            <input id="newSpotArea" placeholder="エリア">
            <input id="newSpotCoord" placeholder="座標 X: Y:">
            <input id="newSpotTags" placeholder="タグ 例：夜景,海">
          </div>
          <button id="addSpotBtn" class="btn primary">追加</button>
        </article>
      </div>
    </section>

    <section id="tab-market" class="panel">
      <div class="grid market-grid">
        <article class="card span-12">
          <h2>相場取得と絞り込み</h2>

          <div class="row">
            <button id="fetchMarketBtn" class="btn primary">Universalis実相場取得</button>
            <button id="clearCacheBtn" class="btn">相場キャッシュ削除</button>
          </div>

          <div id="marketStatus" class="status">ワールド設定後、相場を取得できます。</div>
          <div id="marketSummary" class="summary"></div>

          <h3>カテゴリ</h3>
          <div id="marketFilters" class="chips"></div>

          <label class="switch">
            <input id="showOnlyPossible" type="checkbox">
            <span>できるものだけ表示</span>
          </label>

          <label>
            <span>監視候補検索</span>
            <input id="watchSearchInput" placeholder="アイテム名 / ジョブ / ItemID / メモで検索">
          </label>

          <label class="switch">
            <input id="showOnlyFavorite" type="checkbox">
            <span>お気に入りだけ表示</span>
          </label>
        </article>

        <article class="card span-6">
          <h2>今日売るべきもの</h2>
          <div id="sellTodayList"></div>
        </article>

        <article class="card span-6">
          <h2>自動発掘候補</h2>
          <div id="discoverList"></div>
        </article>

        <article class="card span-6">
          <h2>監視アイテム追加</h2>

          <div class="form-grid two-col">
            <input id="watchName" placeholder="アイテム名">
            <input id="watchItemId" type="number" placeholder="ItemID 任意">
            <input id="watchJob" placeholder="必要ジョブ">
            <input id="watchLevel" type="number" min="0" max="100" value="1">
            <select id="watchType">
              <option value="user">ユーザー追加</option>
              <option value="shard">シャード/クリスタル</option>
              <option value="gather">採集</option>
              <option value="craft">製作</option>
              <option value="future">将来用</option>
            </select>
            <input id="watchMaterialCost" type="number" min="0" value="0" placeholder="素材費">
          </div>

          <button id="addWatchBtn" class="btn primary">追加</button>
        </article>

        <article class="card span-6">
          <h2>手入力 / OCRデモ</h2>
          <textarea id="ocrInput" placeholder="銀鉱 180&#10;ファイアシャード 95"></textarea>
          <button id="parseOcrBtn" class="btn primary">解析</button>
          <div id="ocrCards"></div>
        </article>

        <article class="card span-12">
          <h2>監視候補管理</h2>
          <div id="watchItemList"></div>
        </article>
      </div>
    </section>

    <section id="tab-today" class="panel">
      <article class="card">
        <h2>今日やること</h2>
        <div id="taskProgress" class="badge">0 / 0 完了</div>
        <div id="taskList"></div>
      </article>
    </section>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
