<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eorzea Pocket</title>
<style>
:root{
  --bg1:#050814;
  --bg2:#0b1636;
  --panel:#111b3a;
  --panel2:#152654;
  --line:rgba(255,255,255,.12);
  --text:#f6f8ff;
  --muted:#aeb8d6;
  --blue:#3f7fff;
  --blue2:#2454d8;
  --green:#1db267;
  --yellow:#f3c34d;
  --red:#ff8ea2;
  --radius:18px;
  --shadow:0 14px 36px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  color:var(--text);
  font-family:var(--font);
  background:
    radial-gradient(circle at top,rgba(63,127,255,.18),transparent 34%),
    linear-gradient(180deg,var(--bg2),var(--bg1));
}
body{line-height:1.55}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;color:var(--text)}
.app{width:min(100%,1200px);margin:0 auto;padding:16px 14px 96px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{margin:0;font-size:1.8rem}
.brand p{margin:4px 0 0;color:var(--muted)}
.world-badge{
  min-height:38px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(63,127,255,.13);
  border:1px solid rgba(63,127,255,.28);
  color:#d5e3ff;
  white-space:nowrap;
}
.tabs{
  position:sticky;
  top:0;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(4,8,19,.82);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}
.tab-btn{
  min-height:48px;
  padding:10px 8px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:var(--muted);
  font-weight:800;
}
.tab-btn.active{
  color:#fff;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
}
.panel{display:none}
.panel.active{display:block}
.grid{display:grid;gap:14px}
.card{
  padding:16px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,33,75,.96),rgba(10,19,46,.96));
  box-shadow:var(--shadow);
}
.card h2{margin:0 0 12px;font-size:1.08rem}
.card h3{margin:16px 0 10px;font-size:1rem}
label{display:block;margin-bottom:12px}
label span{display:block;margin-bottom:7px;color:#e2e9ff;font-size:.92rem}
input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid transparent;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:var(--text);
  outline:none;
}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.42)}
input:focus,select:focus,textarea:focus{
  border-color:rgba(63,127,255,.74);
  background:rgba(255,255,255,.08);
}
textarea{min-height:110px;resize:vertical}
.form-grid{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{
  min-height:44px;
  padding:10px 14px;
  border-radius:14px;
  font-weight:800;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
}
.btn.primary{background:linear-gradient(180deg,var(--blue),var(--blue2))}
.btn.danger{color:#ffdbe2;background:rgba(255,142,162,.12);border-color:rgba(255,142,162,.28)}
.btn.small{min-height:34px;padding:7px 10px;font-size:.84rem}
.switch{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.05)}
.switch input{width:20px;height:20px;margin:0;accent-color:var(--blue)}
.item{
  padding:13px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.05);
}
.item + .item{margin-top:10px}
.item.ok{border-color:rgba(29,178,103,.30);background:rgba(29,178,103,.10)}
.item.lock{opacity:.72}
.meta{margin-top:5px;color:var(--muted);font-size:.9rem}
.muted{color:var(--muted)}
.status{
  margin-top:12px;
  padding:12px 13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:var(--muted);
}
.status.ok{color:#c6ffe2;border-color:rgba(29,178,103,.28);background:rgba(29,178,103,.09)}
.status.err{color:#ffd7dd;border-color:rgba(255,142,162,.28);background:rgba(255,142,162,.09)}
.tags,.chips{display:flex;flex-wrap:wrap;gap:7px}
.tags{margin-top:10px}
.chips{margin:8px 0}
.tag,.chip,.badge{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#dce6ff;
  font-size:.8rem;
}
.chip{
  min-height:38px;
  padding:8px 11px;
  border:1px solid var(--line);
  font-weight:700;
}
.chip.active{background:rgba(63,127,255,.18);border-color:rgba(63,127,255,.34)}
.tag.ok{background:rgba(29,178,103,.14);color:#c6ffe2}
.tag.warn{background:rgba(243,195,77,.14);color:#ffe7a7}
.task{display:flex;align-items:center;gap:12px;cursor:pointer}
.task.done{background:rgba(29,178,103,.12)}
.checkmark{
  width:24px;
  height:24px;
  border-radius:8px;
  border:2px solid rgba(255,255,255,.28);
  display:grid;
  place-items:center;
  font-weight:900;
}
.task.done .checkmark{background:rgba(29,178,103,.18);border-color:rgba(29,178,103,.64)}
.summary{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.summary-box{padding:12px;border-radius:14px;background:rgba(255,255,255,.05)}
.summary-value{margin-top:4px;font-weight:900;font-size:1.15rem}
.spot-line{cursor:pointer;transition:.15s ease}
.spot-line:hover,.spot-line.active{border-color:rgba(63,127,255,.48);background:rgba(63,127,255,.12)}
.search-row{margin-bottom:12px}
@media(min-width:800px){
  .app{padding:20px 18px 48px}
  .two-col{grid-template-columns:1fr 1fr}
  .three-col{grid-template-columns:repeat(3,1fr)}
  .market-grid{grid-template-columns:repeat(12,1fr)}
  .span-12{grid-column:span 12}
  .span-6{grid-column:span 6}
}
@media(max-width:799px){
  .topbar{display:block}
  .world-badge{margin-top:10px}
  .summary{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Eorzea Pocket</h1>
      <p>FF14プレイヤー向けスマホ便利ツール</p>
    </div>
    <div id="worldBadge" class="world-badge">Meteor / Shinryu</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="self">自分</button>
    <button class="tab-btn" data-tab="walk">散歩</button>
    <button class="tab-btn" data-tab="market">金策</button>
    <button class="tab-btn" data-tab="today">今日</button>
  </nav>

  <main>
    <section id="tab-self" class="panel active">
      <div class="grid two-col">
        <article class="card">
          <h2>自分情報</h2>

          <div class="form-grid two-col">
            <label><span>キャラ名</span><input id="profileCharacter"></label>
            <label><span>ワールド</span><input id="profileWorld"></label>
            <label><span>DC</span><input id="profileDc"></label>
            <label><span>メイン進行度</span><select id="profileProgress"></select></label>
            <label><span>所持ギル</span><input id="profileGil" type="number" min="0"></label>
            <label><span>軍票</span><input id="profileSeals" type="number" min="0"></label>
            <label><span>ベンチャー</span><input id="profileVentures" type="number" min="0"></label>
          </div>

          <label class="switch">
            <input id="hideLockedSpots" type="checkbox">
            <span>行けない散歩スポットを隠す</span>
          </label>

          <h3>PC / スマホ同期</h3>
          <p class="muted">SupabaseのURLとanon keyを設定すると、同じ同期キーで端末間同期できます。</p>

          <label><span>同期キー</span><input id="syncKey" placeholder="例：yuzu-eorzea-pocket"></label>

          <div class="row">
            <button id="saveProfileBtn" class="btn primary">この端末に保存</button>
            <button id="cloudSaveBtn" class="btn primary">クラウドへ保存</button>
            <button id="cloudLoadBtn" class="btn">クラウドから読み込み</button>
          </div>

          <div id="syncStatus" class="status">未同期</div>
        </article>

        <article class="card">
          <h2>ジョブ / クラスLv</h2>

          <div class="form-grid two-col">
            <label><span>ジョブ名</span><input id="jobNameInput" placeholder="例：ピクトマンサー"></label>
            <label><span>Lv</span><input id="jobLevelInput" type="number" min="0" max="100" value="1"></label>
          </div>

          <button id="addJobBtn" class="btn primary">ジョブ追加</button>

          <h3>クイック追加</h3>
          <div id="quickJobs" class="chips"></div>

          <h3>登録済み</h3>
          <div id="jobList"></div>
        </article>
      </div>
    </section>

    <section id="tab-walk" class="panel">
      <div class="grid two-col">
        <article class="card">
          <h2>散歩スポット</h2>
          <div class="search-row">
            <input id="spotSearchInput" placeholder="夜景、雪、クガネ、花畑、海…">
          </div>

          <div class="row">
            <button id="gachaSpotBtn" class="btn primary">散歩ガチャ</button>
            <button id="clearSpotSearchBtn" class="btn">検索クリア</button>
          </div>

          <div id="spotList"></div>
        </article>

        <article class="card">
          <h2>選択中スポット</h2>
          <div id="spotDetail"></div>

          <h3>スポット追加</h3>
          <div class="form-grid two-col">
            <input id="newSpotName" placeholder="スポット名">
            <input id="newSpotArea" placeholder="エリア">
            <input id="newSpotCoord" placeholder="座標 X: Y:">
            <input id="newSpotTags" placeholder="タグ 例：夜景,海">
          </div>
          <button id="addSpotBtn" class="btn primary">追加</button>
        </article>
      </div>
    </section>

    <section id="tab-market" class="panel">
      <div class="grid market-grid">
        <article class="card span-12">
          <h2>相場取得と絞り込み</h2>

          <div class="row">
            <button id="fetchMarketBtn" class="btn primary">Universalis実相場取得</button>
            <button id="clearCacheBtn" class="btn">相場キャッシュ削除</button>
          </div>

          <div id="marketStatus" class="status">ワールド設定後、相場を取得できます。</div>
          <div id="marketSummary" class="summary"></div>

          <h3>カテゴリ</h3>
          <div id="marketFilters" class="chips"></div>

          <label class="switch">
            <input id="showOnlyPossible" type="checkbox">
            <span>できるものだけ表示</span>
          </label>
        </article>

        <article class="card span-6">
          <h2>今日売るべきもの</h2>
          <div id="sellTodayList"></div>
        </article>

        <article class="card span-6">
          <h2>自動発掘候補</h2>
          <div id="discoverList"></div>
        </article>

        <article class="card span-6">
          <h2>監視アイテム追加</h2>

          <div class="form-grid two-col">
            <input id="watchName" placeholder="アイテム名">
            <input id="watchItemId" type="number" placeholder="ItemID 任意">
            <input id="watchJob" placeholder="必要ジョブ">
            <input id="watchLevel" type="number" min="0" max="100" value="1">
            <select id="watchType">
              <option value="user">ユーザー追加</option>
              <option value="shard">シャード/クリスタル</option>
              <option value="gather">採集</option>
              <option value="craft">製作</option>
              <option value="future">将来用</option>
            </select>
            <input id="watchMaterialCost" type="number" min="0" value="0" placeholder="素材費">
          </div>

          <button id="addWatchBtn" class="btn primary">追加</button>
        </article>

        <article class="card span-6">
          <h2>手入力 / OCRデモ</h2>
          <textarea id="ocrInput" placeholder="銀鉱 180&#10;ファイアシャード 95"></textarea>
          <button id="parseOcrBtn" class="btn primary">解析</button>
          <div id="ocrCards"></div>
        </article>

        <article class="card span-12">
          <h2>監視候補管理</h2>
          <div id="watchItemList"></div>
        </article>
      </div>
    </section>

    <section id="tab-today" class="panel">
      <article class="card">
        <h2>今日やること</h2>
        <div id="taskProgress" class="badge">0 / 0 完了</div>
        <div id="taskList"></div>
      </article>
    </section>
  </main>
</div>
<script>
const SUPABASE_URL = "";

const baseSpots = [
  {id:"s1",name:"ラベンダーベッド夕焼け桟橋",area:"ラベンダーベッド",coord:"X:11.5 Y:8.9",progress:"arr",tags:["夕焼け","水辺","柔らかい"],filter:"Faded Print / 暖色+25",memo:"水面反射を入れる。キャラは黒シルエット寄りでも映える。"},
  {id:"s2",name:"イシュガルド雪道・青い石畳",area:"イシュガルド：上層",coord:"X:7.2 Y:10.3",progress:"hw",tags:["雪","中世","青白い"],filter:"Cool Blue",memo:"暗めに撮って、部分ライトを顔〜上半身に当てると良い。"},
  {id:"s3",name:"アジス・ラー浮遊島シルエット",area:"アジス・ラー",coord:"X:26.2 Y:11.4",progress:"hw",tags:["SF","廃墟","浮遊島"],filter:"Cinematic",memo:"背景の巨大構造物を入れる。暗めにして輪郭を強調。"},
  {id:"s4",name:"クガネ夜景・朱雀門前",area:"クガネ",coord:"X:10.8 Y:9.7",progress:"sb",tags:["夜景","和風","街灯"],filter:"Old Digicam",memo:"提灯背景が強い。縦構図向き。"},

  {id:"s19",name:"ウルティマ・トゥーレ星屑の床",area:"ウルティマ・トゥーレ",coord:"X:21.4 Y:8.9",progress:"ew",tags:["宇宙","星屑","孤高"],filter:"Stardust",memo:"シルエットと余白で壮大さを出す。"},
  {id:"s20",name:"オールド・シャーレアン白壁の朝",area:"オールド・シャーレアン",coord:"X:13.2 Y:10.8",progress:"ew",tags:["白壁","知的","朝"],filter:"Clean Film",memo:"朝の柔らかい光が似合う。"},
  {id:"s21",name:"トライヨラ市場の昼下がり",area:"トライヨラ",coord:"X:14.2 Y:12.0",progress:"dt",tags:["市場","南国","日常"],filter:"CCD Street",memo:"人通りのある街角スナップ向き。"},

function allWatch(){return baseWatch.map(x=>({...x,...(state.overrides[x.id]||{})})).concat(state.customWatch);}

function jobLevel(req){
  return String(req).split("/").map(x=>state.jobs[x.trim()]||0).reduce((a,b)=>Math.max(a,b),0);
}

function canDo(item){return jobLevel(item.job)>=item.level;}

function marketOf(item){
  if(!item.itemId)return null;
  return state.cache.items[String(item.itemId)]||null;
}

function hourly(item,m){
  if(!m||!m.lowest)return null;
  const unit=item.type==="shard"?1400:item.type==="gather"?260:item.type==="craft"?80:0;
  if(!unit)return null;
  return Math.max(0,Math.floor(m.lowest*.95)-Number(item.cost||0))*unit;
}

function reasons(item,m){
  const r=[];
  if(canDo(item))r.push("今のLvで採れる/作れる");else r.push("Lv不足・将来候補");
  if(m){
    if(m.lowest>=1000)r.push("単価そこそこ");
    if(m.lowest>=10000)r.push("単価が高い");
    if(m.velocity>=1)r.push("販売履歴あり");
    if(m.velocity>=5)r.push("販売速度が高い");
    if(m.stock<=80)r.push("在庫やや少なめ");
    if(m.stock<=20)r.push("在庫が少ない");
  }else{
    r.push("相場取得後に再評価");
  }
  if(item.type==="shard")r.push("回転枠");
  return [...new Set(r)].slice(0,5);
}

function score(item){
  const m=marketOf(item);
  let s=canDo(item)?45:-20;
  const h=hourly(item,m);
  if(h)s+=Math.min(45,Math.floor(h/8000));
  if(m){
    s+=Math.min(20,Math.floor(m.velocity*10));
    if(m.stock<=20)s+=14;else if(m.stock<=80)s+=7;
  }
  if(item.type==="shard")s+=8;
  return {item,m,h,score:s,reasons:reasons(item,m)};
}

function filteredEntries(){
  return allWatch().filter(item=>{
    if(state.category==="possible"&&!canDo(item))return false;
    if(state.category==="user"&&!item.custom)return false;
    if(!["all","possible","user"].includes(state.category)&&item.type!==state.category)return false;
    if(state.showOnly&&!canDo(item))return false;
    return true;
  }).map(score).sort((a,b)=>b.score-a.score);
}

    const price=m?Number(m[2].replace(/,/g,"")):null;
    return `<div class="item"><b>${esc(name)}</b><div class="meta">${price!==null?fmt(price)+" ギル":"価格未解析"}</div></div>`;
  }).join("")||`<div class="item">入力してください。</div>`;
}

async function fetchMarket(){
  const ids=allWatch().filter(x=>x.itemId).map(x=>x.itemId);
  if(!ids.length)return setMarketStatus("ItemIDがありません。","err");
  if(state.cache.world===state.profile.world && Date.now()-state.cache.t<21600000){
    setMarketStatus("6時間以内のキャッシュを使用しました。","ok");
    renderMarket();
    return;
  }
  setMarketStatus("Universalisから取得中…","");
  try{
    const url=`https://universalis.app/api/v2/${encodeURIComponent(state.profile.world)}/${ids.join(",")}?listings=10&entries=20`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const json=await res.json();
    const parsed={};
    ids.forEach(id=>{
      const raw=json.items?.[String(id)]||json.items?.[id]||null;
      if(!raw){parsed[String(id)]={lowest:null,stock:0,velocity:0};return;}
      const listings=raw.listings||[];
      const prices=listings.map(x=>Number(x.pricePerUnit||x.price||0)).filter(x=>x>0);
      parsed[String(id)]={
        lowest:prices.length?Math.min(...prices):Number(raw.minPriceNQ||raw.minPrice||0)||null,
        stock:listings.reduce((s,x)=>s+Number(x.quantity||1),0),
        velocity:Number(raw.regularSaleVelocity||raw.nqSaleVelocity||0)
      };
    });
    state.cache={world:state.profile.world,t:Date.now(),items:parsed};
    save(K.cache,state.cache);
    setMarketStatus("相場を取得しました。","ok");
    renderMarket();
  }catch(err){
    console.error(err);
    setMarketStatus("相場取得に失敗しました。ワールド名・通信・CORSを確認してください。","err");
  }
}

function clearCache(){
  state.cache={world:"",t:0,items:{}};
  save(K.cache,state.cache);
  setMarketStatus("キャッシュを削除しました。","ok");
  renderMarket();
}

function setMarketStatus(text,mode){
  $("marketStatus").textContent=text;
  $("marketStatus").className="status "+(mode||"");
}

function renderToday(){
  const tasks=[
    "リテイナー2人を出す",
    "マケボ出品価格を見直す",
    "銀鉱 or シャードを補充",
    "占星術師でレベリングルレ",
    "行ける散歩スポットでSS1枚"
  ];
  if((state.jobs["採掘師"]||0)>=25)tasks.push("銀鉱を10〜30個で小分け出品");
  if((state.jobs["彫金師"]||0)<23)tasks.push("彫金師をLv23まで上げる");
  if((state.jobs["占星術師"]||0)<50)tasks.push("占星術師Lv50を目指す");

  $("taskList").innerHTML=tasks.map(t=>`
    <div class="item task ${state.done[t]?"done":""}" data-task="${escAttr(t)}">
      <span class="checkmark">${state.done[t]?"✓":""}</span>
      <span>${esc(t)}</span>
    </div>`).join("");

  document.querySelectorAll("[data-task]").forEach(el=>{
    el.onclick=()=>{
      const t=el.dataset.task;
      state.done[t]=!state.done[t];
      save(K.done,state.done);
      renderToday();
    };
  });

  $("taskProgress").textContent=`${tasks.filter(t=>state.done[t]).length} / ${tasks.length} 完了`;
}

async function cloudSave(){
  const key=$("syncKey").value.trim();
  if(!key)return setSync("同期キーを入力してください。","err");
  localStorage.setItem(K.syncKey,key);
  saveProfile();
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return setSync("Supabase URL / anon key が未設定です。","err");

  const data=exportData();
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/eorzea_pocket_data?on_conflict=user_key`,{
      method:"POST",
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":"application/json",
        Prefer:"resolution=merge-duplicates"
      },
      body:JSON.stringify({user_key:key,data,updated_at:new Date().toISOString()})
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    setSync("クラウドへ保存しました。","ok");
  }catch(e){
    console.error(e);
    setSync("クラウド保存に失敗しました。Supabase設定を確認してください。","err");
  }
}

async function cloudLoad(){
  const key=$("syncKey").value.trim();
  if(!key)return setSync("同期キーを入力してください。","err");
  localStorage.setItem(K.syncKey,key);
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return setSync("Supabase URL / anon key が未設定です。","err");

  try{
    const url=`${SUPABASE_URL}/rest/v1/eorzea_pocket_data?user_key=eq.${encodeURIComponent(key)}&select=data,updated_at`;
    const res=await fetch(url,{
      headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const rows=await res.json();
    if(!rows.length)return setSync("クラウドにデータがありません。","err");
    importData(rows[0].data);
    setSync("クラウドから読み込みました。","ok");
  }catch(e){
    console.error(e);
    setSync("クラウド読み込みに失敗しました。","err");
  }
}

function exportData(){
  return {
    profile:state.profile,
    jobs:state.jobs,
    spots:state.spots,
    done:state.done,
    customWatch:state.customWatch,
    overrides:state.overrides,
    cache:state.cache
  };
}

function importData(data){
  state.profile=data.profile||defaultProfile;
  state.jobs=data.jobs||defaultJobs;
  state.spots=data.spots||[];
  state.done=data.done||{};
  state.customWatch=data.customWatch||[];
  state.overrides=data.overrides||{};
  state.cache=data.cache||{world:"",t:0,items:{}};

  save(K.profile,state.profile);
  save(K.jobs,state.jobs);
  save(K.spots,state.spots);
  save(K.done,state.done);
  save(K.customWatch,state.customWatch);
  save(K.overrides,state.overrides);
  save(K.cache,state.cache);

  renderAll();
}

function setSync(text,mode){
  $("syncStatus").textContent=text;
  $("syncStatus").className="status "+(mode||"");
}

function load(k,fallback){
  try{
    const v=localStorage.getItem(k);
    return v?JSON.parse(v):clone(fallback);
  }catch{
    return clone(fallback);
  }
}

function save(k,v){
  localStorage.setItem(k,JSON.stringify(v));
}

function clone(v){
  return JSON.parse(JSON.stringify(v));
}

function num(v,min=0,max=999999999){
  const n=Number(v);
  if(!Number.isFinite(n))return min;
  return Math.max(min,Math.min(max,Math.floor(n)));
}

function fmt(n){
  return Number(n||0).toLocaleString("ja-JP");
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function escAttr(s){
  return esc(s).replace(/`/g,"&#96;");
}
