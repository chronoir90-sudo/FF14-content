<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eorzea Pocket</title>
<style>
:root{
  --bg:#050814;
  --card:#0f172a;
  --card2:#07111f;
  --line:#263244;
  --text:#eef2ff;
  --muted:#94a3b8;
  --sky:#38bdf8;
  --ok:#34d399;
  --warn:#fbbf24;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(#07111f,#050814);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
header{
  max-width:1160px;
  margin:auto;
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center;
}
h1{margin:.1em 0;font-size:26px}
h2{margin-top:0}
p{color:var(--muted)}
.logo{color:var(--sky);font-weight:900}
button{
  border:0;
  border-radius:16px;
  background:#1f2937;
  color:white;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer;
}
button:hover{filter:brightness(1.12)}
.primary,header button{background:#0284c7}
nav{
  position:sticky;
  top:0;
  z-index:9;
  max-width:1160px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  background:#050814dd;
  padding:8px;
  backdrop-filter:blur(10px);
}
nav button.active{background:#0284c7}
.tab{
  display:none;
  max-width:1160px;
  margin:auto;
  padding:14px;
}
.tab.active{display:block}
.grid{display:grid;gap:14px}
.two{grid-template-columns:1fr 1.1fr}
.card{
  border:1px solid var(--line);
  background:#0f172acc;
  border-radius:28px;
  padding:16px;
  box-shadow:0 20px 50px #0008;
}
input,select,textarea{
  width:100%;
  border:1px solid #334155;
  border-radius:16px;
  background:#07111f;
  color:var(--text);
  padding:11px;
  margin:5px 0 10px;
}
textarea{min-height:110px}
.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.check{
  display:flex;
  gap:8px;
  align-items:center;
}
.check input{width:auto}
.item,.spot,.task,.job{
  border:1px solid var(--line);
  background:#07111f;
  border-radius:22px;
  padding:12px;
  margin:8px 0;
}
.spot{cursor:pointer}
.ok{border-color:#15803d;background:#052e22}
.lock{opacity:.72}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--warn)}
.badge{
  display:inline-block;
  border-radius:999px;
  background:#0c4a6e;
  color:#bae6fd;
  padding:4px 8px;
  font-size:12px;
  margin:3px;
}
.chips button{
  font-size:12px;
  padding:6px 9px;
  margin:3px;
  background:#1e293b;
}
.job{
  display:grid;
  grid-template-columns:1fr 70px 48px;
  gap:8px;
  align-items:center;
}
.job input{margin:0}
.job .del{
  background:#3f1d2b;
  color:#fecdd3;
}
.addjob{
  display:grid;
  grid-template-columns:1fr 78px 74px;
  gap:8px;
}
.summary{
  font-size:28px;
  font-weight:900;
  background:#052e22;
  border-radius:24px;
  padding:16px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.qr{
  display:grid;
  grid-template-columns:repeat(21,1fr);
  gap:1px;
  background:white;
  border-radius:16px;
  padding:12px;
  max-width:300px;
  margin:auto;
}
.qr div{aspect-ratio:1}
.black{background:#020617}
.white{background:white}
video{
  width:100%;
  aspect-ratio:16/9;
  background:#020617;
  border-radius:20px;
}
.saved{font-size:12px;color:var(--ok)}
@media(max-width:800px){
  header{display:block}
  .two,.formgrid{grid-template-columns:1fr}
  .addjob{grid-template-columns:1fr 70px}
  .addjob button{grid-column:1/3}
  nav button{font-size:12px;padding:9px 4px}
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div>
    <b class="logo">Eorzea Pocket</b>
    <h1>FF14スマホ便利ツール</h1>
    <p>自分情報・進行度別SS散歩・Universalis実相場・今日やること・QR共有</p>
  </div>
  <button id="walkGacha">散歩ガチャ</button>
</header>

<nav>
  <button data-tab="profile" class="active">自分</button>
  <button data-tab="spot">散歩</button>
  <button data-tab="market">金策</button>
  <button data-tab="daily">今日</button>
  <button data-tab="qr">QR</button>
</nav>

<main>
  <section id="profile" class="tab active">

          <label>所持ギル<input id="gil" type="number"></label>

          <label>ベンチャー<input id="ventures" type="number"></label>
        </div>
        <label>メイン進行度<select id="progress"></select></label>
        <label class="check">
          <input id="hideLockedSpots" type="checkbox">
          行けない散歩スポットを隠す
        </label>
        <button id="saveProfile" class="primary">この端末に保存</button>
        <span id="saveStatus" class="saved"></span>
      </article>

      <article class="card">
        <h2>ジョブ/クラスLv</h2>
        <div class="addjob">
          <input id="newJobName" placeholder="例: ピクトマンサー / 木工師">
          <input id="newJobLevel" type="number" min="0" max="100" value="1">
          <button id="addJob">追加</button>
        </div>
        <div id="quickJobs" class="chips"></div>
        <div id="jobList"></div>
      </article>
    </div>
  </section>

  <section id="spot" class="tab">
    <div class="grid two">
      <article class="card">
        <h2 id="spotTitle">エオルゼア散歩</h2>
        <input id="spotSearch" placeholder="夜景、雪、クガネ…">
        <div id="spotList"></div>
      </article>

      <article class="card">
        <h2>選択中スポット</h2>
        <div id="spotDetail"></div>

        <h3>スポット追加</h3>
        <input id="spotName" placeholder="スポット名">
        <div class="formgrid">
          <input id="spotArea" placeholder="エリア">
          <input id="spotCoord" placeholder="座標 X: Y:">
        </div>
        <input id="spotTags" placeholder="タグ 例: 夜景 海 夕焼け">
        <button id="addSpot" class="primary">現在の進行度で追加</button>
      </article>
    </div>
  </section>

  <section id="market" class="tab">
    <div class="grid two">
      <article class="card">
        <h2>マケボ監視 / 今日売るべきもの</h2>
        <p id="marketSub"></p>
        <div class="row">
          <button id="fetchMarket" class="primary">Universalis実相場を取得</button>
          <button id="clearMarketCache">相場キャッシュ削除</button>
        </div>
        <p id="marketStatus" class="small"></p>
        <div id="suggestedItems"></div>

        <h3>自動発掘候補</h3>
        <div class="row">
          <button id="autoDiscover" class="primary">高く売れる候補を自動発掘</button>
          <button id="toggleOnlyDoable">できるものだけ</button>
        </div>
        <div id="discoveryList"></div>

        <h3>監視アイテム追加</h3>
        <div class="formgrid">
          <input id="watchName" placeholder="アイテム名 例: 銀鉱">
          <input id="watchId" type="number" placeholder="ItemID 例: 5113">
          <input id="watchJob" placeholder="必要ジョブ 例: 採掘師">
          <input id="watchLevel" type="number" placeholder="必要Lv 例: 25">
        </div>
        <select id="watchType">
          <option value="gather">採集</option>
          <option value="craft">製作</option>
          <option value="other">その他</option>
        </select>
        <button id="addWatchItem">監視アイテムに追加</button>

        <h3>手入力/OCRデモ</h3>
        <textarea id="marketText"></textarea>
        <button id="analyzeMarket">価格を整理</button>
      </article>

      <article class="card">
        <h2>監視候補</h2>
        <div id="marketList"></div>
      </article>
    </div>
  </section>

  <section id="daily" class="tab">
    <div class="grid two">
      <article class="card">
        <h2>今日やること</h2>
        <div id="taskSummary" class="summary"></div>
        <div id="tasks"></div>
      </article>

      <article class="card">
        <h2>今日のおすすめ進行</h2>
        <div id="plans"></div>
      </article>
    </div>
  </section>

  <section id="qr" class="tab">
    <div class="grid two">
      <article class="card">
        <h2>QR Hub</h2>
        <div id="qrBox" class="qr"></div>
        <textarea id="qrValue"></textarea>
        <div class="row">
          <button id="copyQr">コピー</button>
          <button id="readQr">読み込み</button>
        </div>
      </article>

      <article class="card">
        <h2>カメラQR読み取りデモ</h2>
        <video id="video" playsinline autoplay muted></video>
        <button id="cameraBtn" class="primary">カメラ起動</button>
        <p id="scanLog"></p>
        <button id="spotQr">選択中スポットをQR化</button>
      </article>
    </div>
  </section>
</main>

function $(id) {
  return document.getElementById(id);
}

function order(key) {
  return stages.find(stage => stage[0] === key)?.[2] || 1;
}

function label(key) {
  return stages.find(stage => stage[0] === key)?.[1] || key;
}

function jobLevel(job) {
  if (job.includes("/")) {
    return Math.max(...job.split("/").map(name => profile.jobs[name.trim()] || 0));
  }
  return profile.jobs[job] || 0;
}

function canDo(item) {
  return item.type !== "drop" && jobLevel(item.job) >= item.requiredLevel;
}

function saveAll() {
  localStorage.setItem("ep_profile", JSON.stringify(profile));
  localStorage.setItem("ep_spots", JSON.stringify(spots));
}

function init() {
  stages.forEach(stage => {
    $("progress").innerHTML += `<option value="${stage[0]}">${stage[1]}</option>`;
  });

  ["character","world","dc","gil","companySeals","ventures","progress","hideLockedSpots"].forEach(id => {
    if (id === "hideLockedSpots") $("hideLockedSpots").checked = profile.hideLockedSpots;
    else $(id).value = profile[id];
  });

  $("marketText").value = "銀鉱 200\nシルバーインゴット 659\nウィンドシャード 40";

  loadCachedMarket();
  renderJobs();
  renderAll();
}

function bind() {
  document.querySelectorAll("nav button").forEach(button => {
    button.onclick = () => {
      document.querySelectorAll("nav button,.tab").forEach(element => element.classList.remove("active"));
      button.classList.add("active");
      $(button.dataset.tab).classList.add("active");
    };
  });

  ["character","world","dc","gil","companySeals","ventures","progress","hideLockedSpots"].forEach(id => {
    $(id).oninput = () => {
      profile[id] =
        id === "hideLockedSpots"
          ? $(id).checked
          : $(id).type === "number"
            ? Number($(id).value)
            : $(id).value;

      saveAll();
      renderAll();
    };
  });

  $("addJob").onclick = addJob;

  $("saveProfile").onclick = () => {
    $("saveStatus").textContent = " 保存しました";
    saveAll();
  };

  $("walkGacha").onclick = walkGacha;
  $("spotSearch").oninput = renderSpots;
  $("addSpot").onclick = addSpot;

  $("autoDiscover").onclick = autoDiscover;
  $("toggleOnlyDoable").onclick = toggleOnlyDoable;
  $("addWatchItem").onclick = addWatchItem;

  };

  $("copyQr").onclick = () => navigator.clipboard?.writeText($("qrValue").value);
  $("readQr").onclick = readQr;
  $("spotQr").onclick = () => {
    $("qrValue").value = "eorzea-pocket://spot/" + selected.id;
    renderQr();
  };

  $("qrValue").oninput = renderQr;
}

function escapeQuote(text) {
  return String(text).replaceAll("'", "\\'");
}

function renderJobs() {
  let html = "";

  Object.entries(profile.jobs).forEach(([name, level]) => {
    html += `
      <div class="job">
        <b>${name}</b>
        <input type="number" min="0" max="100" value="${level}" onchange="updateJob('${escapeQuote(name)}', this.value)">
        <button class="del" onclick="removeJob('${escapeQuote(name)}')">削除</button>
      </div>
    `;
  });

  $("jobList").innerHTML = html;

  const missingJobs = standardJobs.filter(job => profile.jobs[job] === undefined).slice(0, 12);

  $("quickJobs").innerHTML = missingJobs
    .map(job => `<button onclick="quickAdd('${job}')">+ ${job}</button>`)
    .join("");
}

window.updateJob = (name, value) => {
  profile.jobs[name] = Math.max(0, Math.min(100, Number(value) || 0));
  saveAll();
  renderAll();
  renderJobs();
};

window.removeJob = name => {
  delete profile.jobs[name];
  saveAll();
  renderAll();
  renderJobs();
};

window.quickAdd = name => {
  profile.jobs[name] = 0;
  saveAll();
  renderAll();
  renderJobs();
};

function addJob() {
  const name = $("newJobName").value.trim();
  if (!name) return;

  profile.jobs[name] = Math.max(0, Math.min(100, Number($("newJobLevel").value) || 0));

  $("newJobName").value = "";
  $("newJobLevel").value = 1;

  renderJobs();
}

function visibleSpots() {
  return spots.filter(spot => !profile.hideLockedSpots || order(spot.progress) <= order(profile.progress));
}

function renderSpots() {
  const query = $("spotSearch").value.toLowerCase();

  const list = visibleSpots().filter(spot =>
    [spot.title, spot.area, spot.coord, label(spot.progress), ...spot.tags]
      .join(" ")
      .toLowerCase()
      .includes(query)
  );

  $("spotTitle").textContent = `エオルゼア散歩：${label(profile.progress)}まで / ${list.length}件`;

  $("spotList").innerHTML = list.map(spot => `
    <div class="spot" onclick="selectSpot('${spot.id}')">
      <b>${order(spot.progress) <= order(profile.progress) ? "🔓" : "🔒"} ${spot.title}</b>
      <div class="small">${spot.area} / ${spot.coord} / ${label(spot.progress)}</div>
      ${spot.tags.map(tag => `<span class="badge">#${tag}</span>`).join("")}

window.selectSpot = id => {

};

function renderSpotDetail() {
  $("spotDetail").innerHTML = `

  `;

function walkGacha() {

  document.querySelector('[data-tab="spot"]').click();

  renderAll();

function addSpot() {
  const name = $("spotName").value.trim();
  if (!name) return;

    id: "spot-" + Date.now(),
    title: name,
    area: $("spotArea").value || "未設定",

    time: "任意",
    weather: "任意",

    tags: $("spotTags").value.split(/[、,\s]+/).filter(Boolean),
    filter: "Old Digicam",

function marketSorted() {
  return items.map(item => {
    const doable = canDo(item);

    const profit =
      item.type === "craft" && item.materialCost
        ? item.worldPrice - item.materialCost
        : item.worldPrice;

    let priority = 0;
    if (doable) priority += 50;
    if (item.velocity === "高") priority += 20;
    if (profit > 0) priority += Math.min(30, profit / 20);
    if (item.item === "銀鉱") priority += 15;
    if (item.api?.saleVelocity) priority += Math.min(20, item.api.saleVelocity * 3);

    return {
      ...item,
      doable,
      profit,
      priority
    };
  }).sort((a, b) => b.priority - a.priority);
}

function renderMarket() {
  $("marketSub").textContent = `${profile.world}想定・今のギャザクラLv基準`;

  $("suggestedItems").innerHTML =
    marketSorted()
      .filter(item => item.doable)
      .slice(0, 4)
      .map(marketCard)
      .join("") || '<p class="small">今できる監視候補がありません</p>';

  $("marketList").innerHTML = marketSorted().map(marketCard).join("");

  if (!$("marketStatus").textContent) {
    $("marketStatus").textContent = marketFresh
      ? "Universalis相場取得済み"
      : "未取得。ボタンで実相場を取得できます。";
  }
}

function reasonText(item) {
  const reasons = [];

  if (item.doable) {
    reasons.push("今のLvで採れる/作れる");
  } else {
    reasons.push("Lv不足・将来候補");
  }

  if (item.worldPrice >= 10000) {
    reasons.push("単価が高い");
  } else if (item.worldPrice >= 1000) {
    reasons.push("単価そこそこ");
  }

  if (item.api?.saleVelocity >= 5) {
    reasons.push("販売速度が高い");
  } else if (item.api?.saleVelocity >= 1) {
    reasons.push("販売履歴あり");
  }

  if (item.api?.totalQty <= 20) {
    reasons.push("在庫が少ない");
  } else if (item.api?.totalQty <= 80) {
    reasons.push("在庫やや少なめ");
  }

  if (item.velocity === "高") {
    reasons.push("回転枠");
  }

  if (!item.api) {
    reasons.push("相場取得後に再評価");
  }

  return reasons.slice(0, 4).join(" / ");
}

function isCustomWatchItem(item) {
  return customWatchItems.some(custom => Number(custom.itemId) === Number(item.itemId));
}

function marketCard(item) {
  const api = item.api
    ? `
      <div class="small">
        API: 最安 ${item.api.minPrice?.toLocaleString() || "-"} /
        在庫 ${item.api.totalQty || 0} /
        直近販売 ${item.api.saleVelocity?.toFixed(1) || 0}/日
      </div>
    `
    : "";

  const deleteButton = isCustomWatchItem(item)
    ? `<button onclick="removeWatchItem(${item.itemId})">監視から削除</button>`
    : "";

  return `
    <div class="item ${item.doable ? "ok" : "lock"}">
      <b>${item.doable ? "🔓" : "🔒"} ${item.item}</b>
      <div class="small">${item.job} Lv${item.requiredLevel}〜 / 回転:${item.velocity}</div>
      <div>${item.worldPrice ? item.worldPrice.toLocaleString() + " gil" : "日課"}</div>
      ${api}
      <p>${item.memo}</p>
      <div class="small">おすすめ理由：${reasonText(item)}</div>
      <span class="badge">${item.doable ? item.advice : "今は不可"}</span>
      ${deleteButton}
    </div>
  `;
}

function removeWatchItem(itemId) {
  customWatchItems = customWatchItems.filter(item => Number(item.itemId) !== Number(itemId));
  items = items.filter(item => {
    const isBase = baseItems.some(base => Number(base.itemId) === Number(item.itemId));
    if (isBase) return true;
    return Number(item.itemId) !== Number(itemId);
  });

  localStorage.setItem("ep_custom_watch_items", JSON.stringify(customWatchItems));

  marketFresh = false;
  $("marketStatus").textContent = "監視アイテムを削除しました。必要なら相場を再取得してください。";

  renderMarket();
  renderDiscovery();
}

function discoveryScore(item) {
  const price = item.worldPrice || 0;
  const saleVelocity = item.api?.saleVelocity || 0;
  const totalQty = item.api?.totalQty ?? 9999;
  const doableBonus = item.doable ? 50 : -40;

  let priceScore = 0;
  if (price >= 10000) priceScore = 35;
  else if (price >= 3000) priceScore = 25;
  else if (price >= 1000) priceScore = 18;
  else if (price >= 200) priceScore = 10;
  else priceScore = 4;

  const velocityScore = Math.min(35, saleVelocity * 6);

  let scarcityScore = 0;
  if (totalQty <= 20) scarcityScore = 20;
  else if (totalQty <= 80) scarcityScore = 12;
  else if (totalQty <= 200) scarcityScore = 6;

  return doableBonus + priceScore + velocityScore + scarcityScore;
}

function renderDiscovery() {
  if (!$("discoveryList")) return;

  const ranked = marketSorted()
    .map(item => ({
      ...item,
      discoveryScore: discoveryScore(item)
    }))
    .filter(item => {
      if (onlyDoableDiscovery) return item.doable;
      return true;
    })
    .sort((a, b) => b.discoveryScore - a.discoveryScore)
    .slice(0, 10);

  $("discoveryList").innerHTML = ranked.map(item => `
    <div class="item ${item.doable ? "ok" : "lock"}">
      <b>${item.doable ? "🔓" : "🔒"} ${item.item}</b>
      <div class="small">
        ${item.job} Lv${item.requiredLevel}〜 /
        発掘スコア ${Math.round(item.discoveryScore)}
      </div>
      <div>${item.worldPrice ? item.worldPrice.toLocaleString() + " gil" : "価格未取得"}</div>
      ${
        item.api
          ? `<div class="small">
              最安 ${item.api.minPrice?.toLocaleString() || "-"} /
              在庫 ${item.api.totalQty || 0} /
              販売 ${item.api.saleVelocity?.toFixed(1) || 0}/日
            </div>`
          : `<div class="small">まだ実相場未取得</div>`
      }
      <p>${item.memo}</p>
      <div class="small">おすすめ理由：${reasonText(item)}</div>
      <span class="badge">${item.doable ? "今日の候補" : "Lv不足"}</span>
    </div>
  `).join("") || '<p class="small">発掘候補がありません。</p>';
}

function analyzeMarket() {
  const rows = $("marketText").value
    .split(/\n|,/)
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      const match = line.match(/^(.+?)\s*(\d{2,})/);
      const name = match ? match[1].trim() : line;
      const price = match ? Number(match[2]) : 0;
      const known = items.find(item => name.includes(item.item) || item.item.includes(name));

      return marketCard({
        ...known,
        item: name,
        worldPrice: price || known?.worldPrice || 0,
        doable: known ? canDo(known) : true,
        job: known?.job || "未設定",
        requiredLevel: known?.requiredLevel || 0,
        velocity: known?.velocity || "要確認",
        advice: known?.advice || "相場確認",
        memo: known?.memo || "出品数と履歴を見て判断"
      });
    })
    .join("");

  $("marketList").innerHTML = rows;
}

async function fetchMarket() {
  const ids = items
    .filter(item => item.itemId)
    .map(item => item.itemId)
    .join(",");

  if (!ids) return;

  const world = encodeURIComponent(profile.world || "Shinryu");

  $("marketStatus").textContent = "Universalisから取得中...";

  try {
    const url = `https://universalis.app/api/v2/${world}/${ids}?listings=10&entries=20`;
    const response = await fetch(url);

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();

    applyMarketData(data);

    localStorage.setItem("ep_market_cache", JSON.stringify({
      t: Date.now(),
      world: profile.world,
      data
    }));

    marketFresh = true;
    $("marketStatus").textContent = "取得成功: " + new Date().toLocaleString();

    renderMarket();
    renderDiscovery();
  } catch (error) {
    $("marketStatus").innerHTML =
      `<span class="warn">取得失敗: ${error.message}。GitHub Pages上/HTTPSで再試行、または手入力を使ってください。</span>`;
  }
}

function applyMarketData(data) {
  const map = data.items || {};

  items = items.map(item => {
    if (!item.itemId) return item;

    const marketData =
      map[item.itemId] ||
      map[String(item.itemId)] ||
      (data.itemID === item.itemId ? data : null);

    if (!marketData) return item;

    const listings = marketData.listings || [];
    const history = marketData.recentHistory || marketData.sales || [];

    const minPrice = listings.length
      ? Math.min(...listings.map(listing => listing.pricePerUnit || listing.price || 999999999))
      : item.worldPrice;

    const totalQty = listings.reduce((sum, listing) => sum + (listing.quantity || 0), 0);

    const saleVelocity =
      marketData.regularSaleVelocity ||
      marketData.nqSaleVelocity ||
      marketData.hqSaleVelocity ||
      0;

    item.worldPrice = minPrice || item.worldPrice;

    item.api = {
      minPrice,
      totalQty,
      saleVelocity,
      historyCount: history.length
    };

    return item;
  });
}

function loadCachedMarket() {
  try {
    const cache = JSON.parse(localStorage.getItem("ep_market_cache") || "null");

    if (cache && cache.data && Date.now() - cache.t < 21600000) {
      applyMarketData(cache.data);
      marketFresh = true;
      $("marketStatus").textContent = "キャッシュ相場を使用: " + new Date(cache.t).toLocaleString();
    }
  } catch (error) {
    console.warn(error);
  }
}

function qrBits(text) {
  let seed = 0;

  for (const char of text) {
    seed = (seed * 31 + char.charCodeAt(0)) >>> 0;
  }

  let html = "";

  for (let index = 0; index < 441; index++) {
    seed = (seed * 1664525 + 1013904223) >>> 0;

    html += `<div class="${(seed % 7 < 3 || (index < 147 && index % 21 < 7)) ? "black" : "white"}"></div>`;
  }

  return html;
}

function renderQr() {
  $("qrValue").value = $("qrValue").value || "eorzea-pocket://spot/" + selected.id;
  $("qrBox").innerHTML = qrBits($("qrValue").value);
}

function readQr() {
  const id = $("qrValue").value.split("/").pop();
  const spot = spots.find(item => item.id === id);

  if (spot) {
    selected = spot;
    document.querySelector('[data-tab="spot"]').click();
  }

  $("scanLog").textContent = spot
    ? "スポットを読み込みました：" + spot.title
    : "QR文字列を受け取りました";
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    $("video").srcObject = stream;
    $("scanLog").textContent = "カメラ起動OK。実装ではBarcodeDetectorでQR解析予定。";
  } catch (error) {
    $("scanLog").textContent = "カメラ起動に失敗。HTTPS/権限を確認。";
  }
}

function renderAll() {
  renderSpots();
  renderMarket();

  renderDaily();
  renderQr();
}
