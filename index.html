    <div class="spot" onclick="selectSpot('${s.id}')">
      <b>${order(s.progress)<=order(profile.progress)?"🔓":"🔒"} ${s.title}</b>
      <div class="small">${s.area} / ${s.coord} / ${label(s.progress)}</div>
      ${s.tags.map(t=>`<span class="badge">#${t}</span>`).join("")}
    </div>`).join("");
  renderSpotDetail();
}
window.selectSpot=id=>{selected=spots.find(s=>s.id===id)||selected;$("qrValue").value="eorzea-pocket://spot/"+selected.id;renderAll()};
function renderSpotDetail(){
  $("spotDetail").innerHTML=`<h3>${selected.title}</h3><p>${selected.memo}</p><div class="item"><b>エリア</b><div>${selected.area}</div></div><div class="item"><b>座標</b><div>${selected.coord}</div></div><div class="item"><b>必要進行</b><div>${label(selected.progress)}</div></div><div class="item"><b>おすすめ加工</b><div>${selected.filter}</div></div>`;
}
function walkGacha(){const list=visibleSpots();selected=list[Math.floor(Math.random()*list.length)]||spots[0];document.querySelector('[data-tab="spot"]').click();renderAll()}
function addSpot(){
  const name=$("spotName").value.trim();if(!name)return;
  const s={id:"spot-"+Date.now(),title:name,area:$("spotArea").value||"未設定",coord:$("spotCoord").value||"X:? Y:?",time:"任意",weather:"任意",progress:profile.progress,tags:$("spotTags").value.split(/[、,\s]+/).filter(Boolean),filter:"Old Digicam",memo:"ユーザー追加スポット",rating:4};
  spots.unshift(s);selected=s;saveAll();renderAll();
}

function reasonText(item){
  const r=[];
  if(item.doable)r.push("今のLvで採れる/作れる");else r.push("Lv不足・将来候補");
  if(item.worldPrice>=10000)r.push("単価が高い");else if(item.worldPrice>=1000)r.push("単価そこそこ");
  if(item.api?.saleVelocity>=5)r.push("販売速度が高い");else if(item.api?.saleVelocity>=1)r.push("販売履歴あり");
  if(item.api?.totalQty<=20)r.push("在庫が少ない");else if(item.api?.totalQty<=80)r.push("在庫やや少なめ");
  if(item.velocity==="高")r.push("回転枠");
  if(!item.api)r.push("相場取得後に再評価");
  return r.slice(0,4).join(" / ");
}
function discoveryScore(item){
  const price=item.worldPrice||0,sale=item.api?.saleVelocity||0,qty=item.api?.totalQty??9999;
  let score=item.doable?50:-40;
  if(price>=10000)score+=35;else if(price>=3000)score+=25;else if(price>=1000)score+=18;else if(price>=200)score+=10;else score+=4;
  score+=Math.min(35,sale*6);
  if(qty<=20)score+=20;else if(qty<=80)score+=12;else if(qty<=200)score+=6;
  if(item.velocity==="高")score+=8;
  return score;
}
function marketSorted(){
  return items.filter(byCategory).map(item=>{
    const doable=canDo(item),profit=item.type==="craft"&&item.materialCost?item.worldPrice-item.materialCost:item.worldPrice;
    let priority=0;
    if(doable)priority+=50;
    if(item.velocity==="高")priority+=20;
    if(profit>0)priority+=Math.min(30,profit/20);
    if(item.api?.saleVelocity)priority+=Math.min(20,item.api.saleVelocity*3);
    return {...item,doable,profit,priority,discoveryScore:0};
  }).sort((a,b)=>b.priority-a.priority);
}
function renderCategoryFilters(){
  const cats=[["all","全部"],["doable","できる"],["shard","シャード/クリスタル"],["gather","採集"],["craft","製作"],["future","将来用"],["custom","ユーザー追加"]];
  $("categoryFilters").innerHTML=cats.map(([key,label])=>`<button class="${activeCategory===key?"active":""}" onclick="setCategory('${key}')">${label}</button>`).join("");
}
window.setCategory=key=>{activeCategory=key;renderMarket();renderDiscovery();renderWatchManager();renderCategoryFilters()};

function marketCard(item){
  const api=item.api?`<div class="small">API: 最安 ${item.api.minPrice?.toLocaleString()||"-"} / 在庫 ${item.api.totalQty||0} / 直近販売 ${item.api.saleVelocity?.toFixed(1)||0}/日</div>`:"";
  const del=isCustom(item)?`<button class="danger" onclick="removeWatchItem(${item.itemId})">監視から削除</button>`:"";
  return `<div class="item ${item.doable?"ok":"lock"}"><b>${item.doable?"🔓":"🔒"} ${item.item}</b><div class="small">${item.job} Lv${item.requiredLevel}〜 / ${typeLabel(item.type)} / 回転:${item.velocity}</div><div>${item.worldPrice?item.worldPrice.toLocaleString()+" gil":"日課"}</div>${api}<p>${item.memo}</p><div class="small">おすすめ理由：${reasonText(item)}</div><span class="badge">${item.doable?item.advice:"今は不可"}</span>${del}</div>`;
}
function renderMarket(){
  $("marketSub").textContent=`${profile.world}想定・今のギャザクラLv基準`;
  const sorted=marketSorted();
  $("suggestedItems").innerHTML=sorted.filter(i=>i.doable).slice(0,5).map(marketCard).join("")||'<p class="small">今できる監視候補がありません</p>';
  $("marketList").innerHTML=sorted.map(marketCard).join("");
  if(!$("marketStatus").textContent)$("marketStatus").textContent=marketFresh?"Universalis相場取得済み":"未取得。ボタンで実相場を取得できます。";
  renderCategoryFilters();renderWatchManager();
}
function renderDiscovery(){
  if(!$("discoveryList"))return;
  const ranked=marketSorted().map(i=>({...i,discoveryScore:discoveryScore(i)})).filter(i=>onlyDoableDiscovery?i.doable:true).sort((a,b)=>b.discoveryScore-a.discoveryScore).slice(0,10);
  $("discoveryList").innerHTML=ranked.map(i=>`<div class="item ${i.doable?"ok":"lock"}"><b>${i.doable?"🔓":"🔒"} ${i.item}</b><div class="small">${i.job} Lv${i.requiredLevel}〜 / 発掘スコア ${Math.round(i.discoveryScore)}</div><div>${i.worldPrice?i.worldPrice.toLocaleString()+" gil":"価格未取得"}</div>${i.api?`<div class="small">最安 ${i.api.minPrice?.toLocaleString()||"-"} / 在庫 ${i.api.totalQty||0} / 販売 ${i.api.saleVelocity?.toFixed(1)||0}/日</div>`:`<div class="small">まだ実相場未取得</div>`}<p>${i.memo}</p><div class="small">おすすめ理由：${reasonText(i)}</div><span class="badge">${i.doable?"今日の候補":"Lv不足"}</span></div>`).join("")||'<p class="small">発掘候補がありません。</p>';
}
function renderWatchManager(){
  const list=items.filter(byCategory);
  $("watchManager").innerHTML=list.map(i=>`<div class="item"><b>${i.item}</b><div class="small">ItemID: ${i.itemId||"未設定"} / ${typeLabel(i.type)} / ${i.job} Lv${i.requiredLevel}〜</div><div class="small">${i.api?"相場取得済み":"未取得"}</div>${isCustom(i)?`<button class="danger" onclick="removeWatchItem(${i.itemId})">削除</button>`:`<span class="badge">標準候補</span>`}</div>`).join("")||'<p class="small">監視候補がありません。</p>';
}
async function autoDiscover(){if(!marketFresh)await fetchMarket();renderDiscovery()}
function toggleOnlyDoable(){onlyDoableDiscovery=!onlyDoableDiscovery;$("toggleOnlyDoable").textContent=onlyDoableDiscovery?"できるものだけ":"全候補表示";renderDiscovery()}
function addWatchItem(){
  const name=$("watchName").value.trim(),itemId=Number($("watchId").value),job=$("watchJob").value.trim()||"未設定",requiredLevel=Number($("watchLevel").value)||0,type=$("watchType").value||"other";
  if(!name||!itemId){alert("アイテム名とItemIDは必須です。");return}
  const newItem={item:name,itemId,type,job,requiredLevel,worldPrice:0,velocity:"未取得",advice:"自動判定",memo:"ユーザー追加の監視アイテム"};
  customWatchItems.push(newItem);
  items=baseItems.concat(customWatchItems);
  localStorage.setItem("ep_custom_watch_items",JSON.stringify(customWatchItems));
  $("watchName").value="";$("watchId").value="";$("watchJob").value="";$("watchLevel").value="";
  marketFresh=false;$("marketStatus").textContent="監視アイテムを追加しました。相場取得を押してください。";
  renderMarket();renderDiscovery();
}
function removeWatchItem(itemId){
  customWatchItems=customWatchItems.filter(i=>Number(i.itemId)!==Number(itemId));
  items=baseItems.concat(customWatchItems);
  localStorage.setItem("ep_custom_watch_items",JSON.stringify(customWatchItems));
  marketFresh=false;$("marketStatus").textContent="監視アイテムを削除しました。必要なら相場を再取得してください。";
  renderMarket();renderDiscovery();
}
function analyzeMarket(){
  const rows=$("marketText").value.split(/\n|,/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^(.+?)\s*(\d{2,})/),name=m?m[1].trim():line,price=m?Number(m[2]):0,known=items.find(i=>name.includes(i.item)||i.item.includes(name));
    return marketCard({...known,item:name,worldPrice:price||known?.worldPrice||0,doable:known?canDo(known):true,job:known?.job||"未設定",requiredLevel:known?.requiredLevel||0,velocity:known?.velocity||"要確認",advice:known?.advice||"相場確認",memo:known?.memo||"出品数と履歴を見て判断"});
  }).join("");
  $("marketList").innerHTML=rows;
}
async function fetchMarket(){
  const ids=items.filter(i=>i.itemId).map(i=>i.itemId).join(",");
  if(!ids)return;
  const world=encodeURIComponent(profile.world||"Shinryu");
  $("marketStatus").textContent="Universalisから取得中...";
  try{
    const url=`https://universalis.app/api/v2/${world}/${ids}?listings=10&entries=20`;
    const res=await fetch(url);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    applyMarketData(data);
    localStorage.setItem("ep_market_cache",JSON.stringify({t:Date.now(),world:profile.world,data}));
    marketFresh=true;$("marketStatus").textContent="取得成功: "+new Date().toLocaleString();
    renderMarket();renderDiscovery();
  }catch(e){
    $("marketStatus").innerHTML=`<span class="warn">取得失敗: ${e.message}。GitHub Pages上/HTTPSで再試行、または手入力を使ってください。</span>`;
  }
}
function applyMarketData(data){
  const map=data.items||{};
  items=items.map(item=>{
    if(!item.itemId)return item;
    const d=map[item.itemId]||map[String(item.itemId)]||(data.itemID===item.itemId?data:null);
    if(!d)return item;
    const listings=d.listings||[],history=d.recentHistory||d.sales||[];
    const min=listings.length?Math.min(...listings.map(l=>l.pricePerUnit||l.price||999999999)):item.worldPrice;
    const qty=listings.reduce((s,l)=>s+(l.quantity||0),0);
    const sale=d.regularSaleVelocity||d.nqSaleVelocity||d.hqSaleVelocity||0;
    item.worldPrice=min||item.worldPrice;
    item.api={minPrice:min,totalQty:qty,saleVelocity:sale,historyCount:history.length};
    return item;
  });
}
function loadCachedMarket(){
  try{
    const cache=JSON.parse(localStorage.getItem("ep_market_cache")||"null");
    if(cache&&cache.data&&Date.now()-cache.t<21600000){
      applyMarketData(cache.data);marketFresh=true;$("marketStatus").textContent="キャッシュ相場を使用: "+new Date(cache.t).toLocaleString();
    }
  }catch(e){console.warn(e)}
}
function renderDaily(){
  const tasks=[
    {id:"retainer",text:"リテイナー2人を出す",group:"毎回",minutes:2},
    {id:"market",text:"マケボ出品価格を見直す",group:"金策",minutes:5},
    {id:"ore",text:"銀鉱 or シャードを補充",group:"金策",minutes:15},
    {id:"roulette",text:"占星術師でレベリングルレ",group:"育成",minutes:25},
    {id:"ss",text:"行ける散歩スポットでSS1枚",group:"SS",minutes:10}
  ];
  if((profile.jobs["採掘師"]||0)>=25)tasks.splice(2,0,{id:"silverOre",text:"銀鉱を10〜30個で小分け出品",group:"金策",minutes:15});
  if((profile.jobs["彫金師"]||0)<23)tasks.push({id:"gsm23",text:"彫金師をLv23まで上げる",group:"育成",minutes:20});
  if((profile.jobs["占星術師"]||0)<50)tasks.push({id:"ast50",text:"占星術師Lv50を目指す",group:"育成",minutes:25});
  const remaining=tasks.filter(t=>!localStorage.getItem("done_"+t.id));
  $("taskSummary").textContent=`${remaining.length}件 / 約${remaining.reduce((s,t)=>s+t.minutes,0)}分`;
  $("tasks").innerHTML=tasks.map(t=>`<div class="task" onclick="toggleTask('${t.id}')">${localStorage.getItem("done_"+t.id)?"✅":"⬜"} <b>${t.text}</b><div class="small">${t.group} / ${t.minutes}分</div></div>`).join("");
  $("plans").innerHTML=[
    "短時間 10分|リテイナー回収/再派遣|相場取得ボタンを押す|売れ残りを1回だけ調整",
    "普通 30分|今日のおすすめ品を採取/製作|占星ルレ1回|蒼天までの行けるスポットでSS1枚",
    "がっつり 60分|採掘30を目指す|彫金23まで上げてインゴット比較を解放|SS加工して投稿"
  ].map(p=>{const a=p.split("|");return `<div class="item"><b>${a[0]}</b>${a.slice(1).map(x=>`<p>・${x}</p>`).join("")}</div>`}).join("");
}
window.toggleTask=id=>{localStorage.getItem("done_"+id)?localStorage.removeItem("done_"+id):localStorage.setItem("done_"+id,"1");renderDaily()};
function qrBits(text){let seed=0;for(const c of text)seed=(seed*31+c.charCodeAt(0))>>>0;let html="";for(let i=0;i<441;i++){seed=(seed*1664525+1013904223)>>>0;html+=`<div class="${(seed%7<3||(i<147&&i%21<7))?"black":"white"}"></div>`}return html}
function renderQr(){$("qrValue").value=$("qrValue").value||"eorzea-pocket://spot/"+selected.id;$("qrBox").innerHTML=qrBits($("qrValue").value)}
function readQr(){const id=$("qrValue").value.split("/").pop(),s=spots.find(i=>i.id===id);if(s){selected=s;document.querySelector('[data-tab="spot"]').click()}$("scanLog").textContent=s?"スポットを読み込みました："+s.title:"QR文字列を受け取りました"}
async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("video").srcObject=stream;$("scanLog").textContent="カメラ起動OK。実装ではBarcodeDetectorでQR解析予定。"}catch(e){$("scanLog").textContent="カメラ起動に失敗。HTTPS/権限を確認。"}}
function renderAll(){renderSpots();renderMarket();renderDiscovery();renderDaily();renderQr()}
bind();
init();
</script>
